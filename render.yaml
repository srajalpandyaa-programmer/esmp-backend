services:
  - type: web
    name: esmp
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: esmp-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: ""
      - key: APP_ENV
        value: production

databases:
  - name: esmp-db
    plan: free
